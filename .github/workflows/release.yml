# Release — zthl-bashpy-migrate
# 复刻 spz2glb release.yml 的打 tag 发布模式：
#   v* tag push → changelog-check gate（CHANGELOG 覆盖门禁）→ build wheel/sdist → GitHub Release
# 原则：workflow 是 CI/CD 的源代码——每次改动必须过 actionlint + zizmor（在线）。
name: Release
run-name: Release - ${{ github.ref_name }}
# 最小权限：只有 release job 需要 contents: write（创建 Release），其余 job 只读
permissions:
  contents: read
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: "1.7.7"

jobs:
  # ── 门禁 1：CHANGELOG 覆盖门禁（复刻 spz2glb PR #23 Pre-Tag Changelog-Coverage Gate）──
  # 验证自上一 tag 以来每个 commit 都被 CHANGELOG.md 覆盖；squash PR 按 (#N) 匹配，
  # 直接 commit 回退关键词匹配，docs: 自文档豁免。不覆盖则发布失败（tag-as-freeze 模型防漏记）。
  changelog-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # 全量 tag 历史：gate 需要 git tag 排序找上一 tag（浅克隆无 tag → 误判跳过）
          fetch-depth: 0
      - name: Changelog coverage gate
        run: bash scripts/changelog-check.sh

  # ── 构建：Python wheel + sdist ─────────────────────────────────────
  build:
    needs: changelog-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
      - name: Install build backend
        run: pip install build
      - name: Build wheel + sdist
        run: python -m build
      - name: Build DSH npm bundle + integrity (supply-chain)
        run: |
          bash scripts/npm-bundle.sh
          # tgz + integrity 清单并入 dist 资产（release 附件即官方 integrity 来源）
          cp npm/dsh-bashpy-migrate/*.tgz dist/
          cp npm/dsh-bashpy-migrate/npm-integrity.json dist/
      # wheel 完整性清单（2026-08-26）：skill 侧 gk_bashpy_upgrade upgrade 下载 wheel 后
      # 与官方 wheel-integrity.json sha256 比对——堵 wheel self-certification 漏洞
      # （投毒 wheel 自证哈希无第三方比对源）。release 附件即官方对账源。
      - name: Build wheel integrity manifest (supply-chain)
        run: |
          python3 - <<'PY'
          import glob, hashlib, json
          whl = glob.glob("dist/*.whl")[0]
          h = hashlib.sha256(open(whl, "rb").read()).hexdigest()
          json.dump({"wheel": whl.split("/")[-1], "sha256": h},
                    open("dist/wheel-integrity.json", "w"), indent=2)
          print("wheel sha256:", h)
          PY
      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ── 发布：GitHub Release（release notes 由 generate_release_notes 自动生成）──
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dist
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

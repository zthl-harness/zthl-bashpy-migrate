# CI — zthl-bashpy-migrate（纯 Python 项目，完整模板裁剪自 spz-gatekeeper ci-pipeline-template）
# 原则：workflow 是 CI/CD 的源代码——每次改动必须过 actionlint + zizmor。
name: CI
run-name: CI - ${{ github.ref_name }}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'zthl_bashpy_migrate/**'
      - 'tests/**'
      - 'npm/**'
      - 'scripts/*.sh'
      - '.github/workflows/*.yml'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'zthl_bashpy_migrate/**'
      - 'tests/**'
      - 'npm/**'
      - 'scripts/*.sh'
      - '.github/workflows/*.yml'
      - 'pyproject.toml'

env:
  ACTIONLINT_VERSION: "1.7.7"

jobs:
  # ── 必选 1：多版本 × 多 OS 测试矩阵 ────────────────────────────────
  # 跨平台复刻 spz2glb release.yml（windows/ubuntu/macos）：2 个标准 macOS runner
  # macos-latest（= macOS 15）+ macos-14（macos-15/macos-15-intel 不在可用标签；
  # 显式 15 系仅付费 xlarge/large/xl）。全矩阵 4 OS × 6 py = 24 job
  test:
    name: test (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-14]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e . pytest
      - name: Run pytest
        run: pytest tests -q

  # ── 必选 2：CLI 冒烟 + 发布就绪（验证入口真实可用，非只跑 pytest）──
  quality:
    name: quality (CLI smoke)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: CLI smoke (analyze + audit on real sample)
        run: |
          bashpy-migrate --version
          cat > /tmp/sample.sh <<'EOF'
          _parent() {
            local x=1
            _child
          }
          _child() { echo "$x"; }
          _write_state() { echo "s" > state.json; }
          cmd_main() {
            if [ -n "$DRY_RUN" ]; then echo skip; else _write_state; fi
          }
          EOF
          bashpy-migrate analyze --script /tmp/sample.sh
          bashpy-migrate audit --script /tmp/sample.sh --entry cmd_main --write-fns "_write_state"

  # ── 必选 4：调试 JSON 报告（复刻 spz2glb test-wasm-build wasm_hash_report.json 模式）──
  # 结构化报告下载即看（每用例耗时/结果 + 环境 + CLI 冒烟输出），无需翻 Actions 页面逐条查日志。
  report:
    name: report (debug JSON)
    needs: [test, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e . pytest
      - name: Run pytest with junit
        run: pytest tests -q --junitxml=report.xml
      - name: Generate structured test-report.json
        run: |
          python - <<'PY'
          import json, platform, time, xml.etree.ElementTree as ET
          tree = ET.parse("report.xml")
          suite = tree.getroot()
          # pytest junit：聚合属性在 <testsuite> 子元素（根是 <testsuites>，无统计属性）
          ts = next(suite.iter("testsuite"), suite)
          cases = []
          for tc in suite.iter("testcase"):
              cases.append({
                  "name": tc.get("classname") + "." + tc.get("name"),
                  "time": float(tc.get("time", 0)),
                  "status": ("failed" if tc.find("failure") is not None
                             else "skipped" if tc.find("skipped") is not None else "passed"),
              })
          report = {
              "generatedAt": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "python": platform.python_version(),
              "platform": platform.platform(),
              "summary": {
                  "tests": int(ts.get("tests", 0)),
                  "failures": int(ts.get("failures", 0)),
                  "errors": int(ts.get("errors", 0)),
                  "skipped": int(ts.get("skipped", 0)),
                  "time": float(ts.get("time", 0)),
              },
              "testcases": cases,
          }
          json.dump(report, open("test-report.json", "w", encoding="utf-8"),
                    indent=2, ensure_ascii=False)
          print(f"test-report.json: {len(cases)} cases, summary={report['summary']}")
          PY
      - name: CLI smoke → cli-report.json
        run: |
          cat > /tmp/sample.sh <<'EOF'
          _parent() {
            local x=1
            _child
          }
          _child() { echo "$x"; }
          _write_state() { echo "s" > state.json; }
          cmd_main() {
            if [ -n "$DRY_RUN" ]; then echo skip; else _write_state; fi
          }
          EOF
          bashpy-migrate --version > cli-version.txt
          set +e
          bashpy-migrate analyze --script /tmp/sample.sh > cli-analyze.txt 2>&1; A_RC=$?
          bashpy-migrate audit --script /tmp/sample.sh --entry cmd_main --write-fns "_write_state" > cli-audit.txt 2>&1; U_RC=$?
          set -e
          export A_RC U_RC
          python - <<'PY'
          import json, os
          def _read(p):
              try:
                  return open(p, encoding="utf-8").read()
              except OSError:
                  return None
          blob = {
              "cliVersion": _read("cli-version.txt").strip() if _read("cli-version.txt") else None,
              "analyze": {"exit": int(os.environ.get("A_RC", "-1")), "output": _read("cli-analyze.txt")},
              "audit": {"exit": int(os.environ.get("U_RC", "-1")), "output": _read("cli-audit.txt")},
          }
          json.dump(blob, open("cli-report.json", "w", encoding="utf-8"),
                    indent=2, ensure_ascii=False)
          print(f"cli-report.json written (analyze rc={blob['analyze']['exit']}, audit rc={blob['audit']['exit']})")
          PY
      - name: Upload debug reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: debug-reports
          path: |
            test-report.json
            report.xml
            cli-report.json
          retention-days: 7

  # ── 必选 3：脚本安全审计 ───────────────────────────────────────────
  security-audit:
    name: security-audit (actionlint + T1059)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: actionlint
        run: |
          curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash" | bash
          ./actionlint -color
      - name: zizmor (workflow supply chain)
        # 对齐门卫 ci.yml security-audit：workflow 是 CI/CD 的源代码，供应链扫描非阻塞 = 无防御
        # 在线模式（--gh-token）：走 GitHub API 做深度审计（impostor-commit 等 action 引用校验），
        # 令牌只需只读（permissions: contents: read）；auto-fix（zizmor --fix）仅本地开发用，CI 是纯门禁不自动改文件。
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install zizmor
          zizmor --gh-token "$GH_TOKEN" --format plain --min-severity medium .github/workflows/
      - name: Dangerous command static scan (D-class T1059)
        run: |
          # 方案 A（零依赖，主防线）：危险命令模式 grep，命中即 FAIL
          #   rm -rf 家族 / git push --force / git reset --hard / git clean -f
          if grep -rnE '\brm[[:space:]]+-r[f]?\b|git push --force|git reset --hard|git clean -[fd]' \
              --include='*.sh' --include='*.bash' . ; then
            echo "::error::dangerous command found in shell script (D 类 T1059)"
            exit 1
          fi

  # ── 可选：跨平台编码防御（纯 Python 项目只需 L1/L2）───────────────
  encoding-defense:
    name: encoding-defense (L1 BOM / L2 CRLF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: L2 CRLF check
        run: |
          if grep -rIl $'\r' --include='*.py' --include='*.toml' --include='*.yml' --include='*.yaml' . ; then
            echo "::error::CRLF found in source files (L2)"
            exit 1
          fi
      - name: L1 UTF-8 BOM check
        run: |
          if grep -rIl $'^\xEF\xBB\xBF' --include='*.py' . ; then
            echo "::error::UTF-8 BOM found (L1)"
            exit 1
          fi

  # ── 供应链：DSH npm 包装包投毒防护（2026-08-26）──────────────
  # 插件自己发 npm 包 → 必须被自身 CI 检测是否被投毒。
  # 机制：scripts/npm-bundle.sh 构建 tarball + 计算 sha512 integrity（内容确定性），
  # 产出 npm-integrity.json。skill 侧 gk_plugin_manifest 对 url:npm: 强制
  # config.integrity 对账；发布后 npm view <pkg>@<ver> dist.integrity 与本地 hash 比对
  # 即检测 registry 投毒（对齐 zizmor 供应链审计同款哲学：无对账 = 无防御）。
  npm-supply-chain:
    name: npm-supply-chain (pack + integrity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node engine tests (npm adapter)
        run: |
          node --test npm/dsh-bashpy-migrate/index.test.mjs
      - name: Build bundle + integrity manifest
        run: |
          bash scripts/npm-bundle.sh
          cat npm/dsh-bashpy-migrate/npm-integrity.json
      - name: Verify pack contents (only declared files ship)
        run: |
          cd npm/dsh-bashpy-migrate
          tar tzf ./*.tgz | grep -E 'package/(index.js|engine.js|cordis.patch.yml|package.json)$' | sort
          test "$(tar tzf ./*.tgz | grep -c '^package/' )" -eq 4
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-integrity
          path: npm/dsh-bashpy-migrate/npm-integrity.json
          retention-days: 7
